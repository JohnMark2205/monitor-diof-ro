name: Monitoramento Horário DIOF

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar repositório
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Instalar dependências
      run: |
        pip install -r requirements.txt

    - name: Rodar Coletor Robusto
      run: python src/coletor.py

    - name: Salvar Atualização (Se houver)
      uses: stefanzweifel/git-auto-commit-action@v4
      with:
        commit_message: "🚨 Novo PDF detectado no DIOF (Auto-Update)"
        file_pattern: data/dados.json
        skip_dirty_check: false